openapi: 3.0.3
info:
  title: AgenticInventory AI — ETA Review API
  version: 0.1.0
  description: |
    Surfaces the review queue raised by the Supplier Delivery ETA Agent.
    All endpoints require the existing cookie-session admin auth.
servers:
  - url: /api/v1
paths:
  /eta-reviews:
    get:
      summary: List ETA review items
      operationId: listEtaReviews
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [pending, approved, corrected, dismissed, all]
            default: pending
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: A paginated list of review items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtaReviewListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /eta-reviews/{review_id}:
    parameters:
      - in: path
        name: review_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a single review item with full context
      operationId: getEtaReview
      responses:
        '200':
          description: Single review item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtaReviewDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /eta-reviews/{review_id}/approve:
    parameters:
      - in: path
        name: review_id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Approve the agent's parse and apply it to the delivery
      operationId: approveEtaReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Empty body — accept the agent's proposed values as-is.
      responses:
        '200':
          description: Review approved; delivery updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtaReviewDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Review already resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /eta-reviews/{review_id}/correct:
    parameters:
      - in: path
        name: review_id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Override the agent's parse and apply admin-supplied values
      operationId: correctEtaReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EtaReviewCorrectRequest' }
      responses:
        '200':
          description: Review corrected; delivery updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtaReviewDetailResponse' }
        '400':
          description: Invalid payload (e.g. parsed_date in the past, unknown delivery_id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Review already resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /eta-reviews/{review_id}/dismiss:
    parameters:
      - in: path
        name: review_id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Dismiss the review without changing the delivery
      operationId: dismissEtaReview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Review dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtaReviewDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Review already resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  responses:
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Review item not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    EtaReviewListResponse:
      type: object
      required: [items, total, page, per_page, pages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EtaReviewSummary' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        pages: { type: integer, minimum: 0 }

    EtaReviewSummary:
      type: object
      required:
        - id
        - raised_at
        - raised_reason
        - agent_intent
        - agent_confidence
        - resolution_state
        - supplier_reply_excerpt
        - supplier_from
      properties:
        id: { type: string, format: uuid }
        raised_at: { type: string, format: date-time }
        raised_reason:
          type: string
          enum: [low_confidence, unmatched_order, ambiguous_match, negative_intent, past_date, non_english]
        agent_intent:
          type: string
          enum: [confirm, delay, cancel, acknowledge, unclear]
        agent_parsed_date: { type: string, format: date-time, nullable: true }
        agent_confidence: { type: number, minimum: 0, maximum: 100 }
        resolution_state:
          type: string
          enum: [pending, approved, corrected, dismissed]
        candidate_delivery_id: { type: string, format: uuid, nullable: true }
        supplier_from: { type: string, format: email }
        supplier_reply_excerpt: { type: string, maxLength: 400 }

    EtaReviewDetailResponse:
      allOf:
        - $ref: '#/components/schemas/EtaReviewSummary'
        - type: object
          required:
            - agent_reasoning
            - candidate_order_ids
            - supplier_reply
          properties:
            agent_reasoning: { type: string }
            candidate_order_ids:
              type: array
              items: { type: string, format: uuid }
            supplier_reply:
              type: object
              required: [id, subject, from_address, received_at, body_excerpt]
              properties:
                id: { type: string, format: uuid }
                subject: { type: string }
                from_address: { type: string, format: email }
                received_at: { type: string, format: date-time }
                body_excerpt: { type: string }
            resolved_by: { type: string, nullable: true }
            resolved_at: { type: string, format: date-time, nullable: true }
            resolution_payload:
              type: object
              nullable: true
              properties:
                delivery_id: { type: string, format: uuid }
                parsed_date: { type: string, format: date-time }
                intent:
                  type: string
                  enum: [confirm, delay, cancel, acknowledge]

    EtaReviewCorrectRequest:
      type: object
      required: [delivery_id, parsed_date, intent]
      properties:
        delivery_id: { type: string, format: uuid }
        parsed_date: { type: string, format: date-time }
        intent:
          type: string
          enum: [confirm, delay, cancel, acknowledge]
        note: { type: string, maxLength: 500 }
